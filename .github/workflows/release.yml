name: Release & Publish

on:
  push:
    branches:
      - main

jobs:
  release:
    name: Version, Build & Release
    runs-on: ubuntu-latest
    permissions:
      contents: write   # necessário para criar tags e releases

    steps:
      - name: Checkout (histórico completo)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # obrigatório para git log do changelog e leitura de tags

      # ── Calcula a próxima versão ────────────────────────────────────────────
      - name: Determinar próxima versão
        id: version
        run: |
          LATEST=$(git tag --sort=-v:refname | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | head -1)

          if [ -z "$LATEST" ]; then
            # Nenhuma tag ainda — começa em 2.0.0
            NEXT="2.0.0"
          else
            LATEST_MAJOR=$(echo "$LATEST" | cut -d. -f1)
            if [ "$LATEST_MAJOR" -lt 2 ]; then
              # Tags de versão legada (1.x) — salta para 2.0.0
              NEXT="2.0.0"
            else
              IFS='.' read -r MAJOR MINOR PATCH <<< "$LATEST"
              NEXT="${MAJOR}.${MINOR}.$((PATCH + 1))"
            fi
          fi

          echo "latest=${LATEST}"  >> "$GITHUB_OUTPUT"
          echo "next=${NEXT}"      >> "$GITHUB_OUTPUT"
          echo "▶ ${LATEST:-nenhuma} → ${NEXT}"

      # ── Gera o changelog desde a última tag ────────────────────────────────
      - name: Gerar changelog
        id: changelog
        run: |
          LATEST="${{ steps.version.outputs.latest }}"

          if [ -z "$LATEST" ]; then
            RANGE=""
          else
            RANGE="${LATEST}..HEAD"
          fi

          LOG=$(git log ${RANGE} --pretty=format:"* %s (%h)" --no-merges)
          [ -z "$LOG" ] && LOG="* Atualização inicial"

          # Escapa o multiline para o GITHUB_OUTPUT
          {
            echo "changes<<__CHANGELOG_EOF__"
            echo "$LOG"
            echo "__CHANGELOG_EOF__"
          } >> "$GITHUB_OUTPUT"

      # ── Docker ─────────────────────────────────────────────────────────────
      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login no Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build e push da imagem
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/websage-api:${{ steps.version.outputs.next }}
            ${{ secrets.DOCKERHUB_USERNAME }}/websage-api:latest
          # Cache entre runs via GitHub Actions cache
          cache-from: type=gha
          cache-to:   type=gha,mode=max

      # ── Tag + Release no GitHub ────────────────────────────────────────────
      - name: Criar tag e release no GitHub
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.next }}
          name: "v${{ steps.version.outputs.next }}"
          body: |
            ## O que mudou

            ${{ steps.changelog.outputs.changes }}

            ---

            ## Imagem Docker

            ```bash
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/websage-api:${{ steps.version.outputs.next }}
            ```

            **Changelog completo**: https://github.com/${{ github.repository }}/compare/${{ steps.version.outputs.latest }}...${{ steps.version.outputs.next }}
